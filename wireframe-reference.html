function render(){const params=new URLSearchParams(location.search);let id=params.get('screen')||'dashboard';if(!pages[id])id='dashboard';document.getElementById('nav').querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active',a.dataset.id===id));document.getElementById('crumb').textContent=pages[id].title;document.getElementById('screen').innerHTML=head(pages[id].phase,pages[id].title,pages[id].desc,pages[id].actions)+pages[id].body;document.title=`EksporFlow · ${pages[id].title}`;}
render();
// Camera controls are interactive in the local visual-review mockup.
const view=document.querySelector('.cargo-view'), model=view?.querySelector('.container3d');
if(view&&model){let rx=5,ry=-17,zoom=1,drag=null;const apply=()=>model.style.transform=`perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${zoom})`;const controls=view.previousElementSibling?.querySelectorAll('button')||[];const preset=(name)=>{if(name==='Isometric'){rx=5;ry=-17}else if(name==='Samping'){rx=0;ry=-78}else if(name==='Atas'){rx=-82;ry=-17}else{rx=5;ry=-17;zoom=1}controls.forEach(b=>{const on=b.textContent.trim()===name;b.classList.toggle('primary',on)});apply()};controls.forEach(b=>b.addEventListener('click',()=>preset(b.textContent.trim())));view.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];view.setPointerCapture(e.pointerId);view.style.cursor='grabbing'});view.addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-drag[0])*.45;rx=Math.max(-85,Math.min(85,rx+(e.clientY-drag[1])*.45));drag=[e.clientX,e.clientY];apply()});view.addEventListener('pointerup',()=>{drag=null;view.style.cursor='grab'});view.addEventListener('pointercancel',()=>{drag=null;view.style.cursor='grab'});view.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.72,Math.min(1.45,zoom+(e.deltaY<0?.06:-.06)));apply()},{passive:false});apply()}
</script></body></html>
